# Alertmanager routing. Both notifiers below are file-based secrets (url_file /
# auth_password_file), never a literal webhook URL or password in this file --
# see alertmanager/secrets/ (gitignored) and README's "Notifications" section.
# Uncomment one or both receivers to enable them; both can run at once.
route:
  receiver: default
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # --- Generic webhook (ntfy, Discord, your own receiver, etc.) ---
