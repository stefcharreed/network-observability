name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Bring up the stack
        run: docker compose up -d

      - name: Wait for services to report healthy
        run: |
          for i in $(seq 1 30); do
            prom=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9090/-/healthy || echo 000)
            am=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9093/-/healthy || echo 000)
            graf=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo 000)
            snmp=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9116/ || echo 000)
            node=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9100/metrics || echo 000)
            if [ "$prom" = "200" ] && [ "$am" = "200" ] && [ "$graf" = "200" ] && [ "$snmp" = "200" ] && [ "$node" = "200" ]; then
              echo "All services healthy after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for services (prometheus=$prom alertmanager=$am grafana=$graf snmp_exporter=$snmp node_exporter=$node)"
          docker compose logs
          exit 1

      - name: Confirm target wiring (snmp-cisco registered, node_exporter up)
        # Parsed with python, not grep -- "health" sits after several nested `}`
        # closes relative to "job" in Prometheus's JSON, so a brace-bounded grep
        # can't span the two fields reliably.
        #
        # Polled, not single-shot: node_exporter's own /metrics endpoint being up
        # (checked in the previous step) is not the same as Prometheus having
        # actually completed a scrape of it yet -- scrape_interval is 30s, so
        # right after startup the target can still be "unknown" for a bit.
        run: |
          for i in $(seq 1 12); do
            result=$(curl -s http://localhost:9090/api/v1/targets | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          targets = data['data']['activeTargets']
          jobs = {t['labels'].get('job') for t in targets}
          if 'snmp-cisco' not in jobs:
              print('FAIL: snmp-cisco job missing'); sys.exit(1)
          node = [t for t in targets if t['labels'].get('job') == 'node_exporter']
          if not node or node[0]['health'] != 'up':
              print('WAIT: node_exporter target not up yet'); sys.exit(1)
          print('OK: snmp-cisco job registered, node_exporter target up')
          ")
            echo "$result"
            [ "${result:0:2}" = "OK" ] && exit 0
            [ "${result:0:4}" = "FAIL" ] && exit 1
            sleep 5
          done
          echo "Timed out waiting for node_exporter target to go up"
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down
