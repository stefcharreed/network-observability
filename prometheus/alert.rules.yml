# One real alert, alerting-as-code. The README walks the deliberate
# false-positive -> tune exercise around this rule; the tuned form below is the
# end state (the naive form is the starting point you break on purpose).
groups:
  - name: network-interfaces
    rules:
      - alert: InterfaceDown
        # Tuned: only alert on interfaces that are operationally down (2) AND
        # administratively up (1). The naive `ifOperStatus == 2` fires on every
        # shut/unused port — that's the false positive you tune away. `for: 2m`
        # then suppresses transient link blips.
        expr: ifOperStatus == 2 and ifAdminStatus == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Interface down on {{ $labels.instance }}"
          description: "{{ $labels.ifDescr }} on {{ $labels.instance }} has been down >2m."

  - name: config-audit
    rules:
      - alert: ConfigDrift
        # Fires once PER drifted device (config_audit_device_drift only has a
        # series per drifted device -- see export_config_drift.py), not once
        # for the aggregate count. That's deliberate: it puts the device name
        # and its management IP directly in the alert via $labels, instead of
        # a bare count you'd still have to go cross-reference by hand.
        #
        # No `for:` debounce -- unlike a flapping interface, a drift finding
        # from config-audit is already a discrete, deliberate result (one
        # diff, run once), not a noisy raw counter. There's nothing to
        # debounce.
        expr: config_audit_device_drift == 1
        labels:
          severity: warning
        annotations:
          summary: "Config drift on {{ $labels.device }} ({{ $labels.ip }})"
          description: >-
            {{ $labels.device }} ({{ $labels.ip }}) has detected config drift.
            Run `config-audit diff` to see exactly what changed. If the change
            was authorized, run `config-audit promote {{ $labels.device }}` to
            accept it as the new baseline. If it wasn't, SSH to
            {{ $labels.ip }} and revert the config by hand to match the
            baseline, then re-run `config-audit backup` and confirm `diff`
            shows clean. See README's "If drift fires" section.
