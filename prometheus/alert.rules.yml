# One real alert, alerting-as-code. The README walks the deliberate
# false-positive -> tune exercise around this rule; the tuned form below is the
# end state (the naive form is the starting point you break on purpose).
groups:
  - name: network-interfaces
    rules:
      - alert: InterfaceDown
        # Tuned: only alert on interfaces that are operationally down (2) AND
        # administratively up (1). The naive `ifOperStatus == 2` fires on every
        # shut/unused port — that's the false positive you tune away. `for: 2m`
        # then suppresses transient link blips.
        expr: ifOperStatus == 2 and ifAdminStatus == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Interface down on {{ $labels.instance }}"
          description: "{{ $labels.ifDescr }} on {{ $labels.instance }} has been down >2m."

  - name: config-audit
    rules:
      - alert: ConfigDrift
        # No `for:` debounce -- unlike a flapping interface, a drift finding from
        # config-audit is already a discrete, deliberate result (one diff, run
        # once), not a noisy raw counter. There's nothing to debounce.
        expr: config_audit_devices_drifted > 0
        labels:
          severity: warning
        annotations:
          summary: "Config drift detected on {{ $value }} device(s)"
          description: >-
            Run `config-audit diff` to see exactly what changed. If the change was
            authorized, run `config-audit promote <device>` to accept it as the new
            baseline. If it wasn't, revert the device's config by hand to match the
            baseline, then re-run `config-audit backup` and confirm `diff` shows
            clean. See README's "If drift fires" section.
